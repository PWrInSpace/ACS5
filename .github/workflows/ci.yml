name: CI

on:
  push:
  pull_request:

jobs:
  host-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake ninja-build gcc
      - name: Configure
        run: cmake --preset host
      - name: Build
        run: cmake --build --preset host
      - name: Test (ASan + UBSan)
        run: ctest --preset host -j"$(nproc)"

  firmware:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        preset: [Debug, Release, Bench]
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain
        run: >
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          cmake ninja-build gcc-arm-none-eabi libnewlib-arm-none-eabi
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - uses: actions/upload-artifact@v5
        with:
          name: firmware-${{ matrix.preset }}
          path: |
            build/${{ matrix.preset }}/*.elf
            build/${{ matrix.preset }}/*.map
